<!DOCTYPE html>
<html>
<head>
    <title>Text Properties</title>

    <style>
        #myText {
            color: magenta;
            text-align: right;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 60px;
        }
    </style>

</head>
<body>

    <div id="myText">
        welcome to css world. this is an example of text properties.
    </div>

</body>
</html>
