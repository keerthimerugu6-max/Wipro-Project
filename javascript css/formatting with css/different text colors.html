<!DOCTYPE html>
<html>
<head>
    <title>Different Text Colors</title>

    <style>
        h1 {
            color: red;
        }

        h2 {
            color: blue;
        }

        p {
            color: green;
        }

        div {
            color: purple;
        }
    </style>

</head>
<body>

    <h1>Red Heading</h1>

    <h2>Blue Heading</h2>

    <p>Green paragraph text.</p>

    <div>Purple div text.</div>

</body>
</html>
