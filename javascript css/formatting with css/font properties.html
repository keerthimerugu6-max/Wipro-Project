<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        #myText {
            font-family: Verdana;
            font-style: italic;
            font-size: 20px;
            text-align: left;
            font-weight: bold;
            color: red;
        }
    </style>

</head>
<body>

    <div id="myText">
        This is an example of different font properties.
    </div>

</body>
</html>
