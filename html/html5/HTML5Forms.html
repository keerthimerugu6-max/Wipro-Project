<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Forms</title>
</head>
<body>

    <h1>HTML5 Forms</h1>


    <!-- Visitor Information Form -->
    <div>

        <h2>Visitors Information</h2>

        <form>

            <table border="1" cellpadding="8">

                <tr>
                    <td>Email Address</td>
                    <td>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>User's Interest</td>
                    <td>
                        <input
                            type="checkbox"
                            name="interest"
                            value="web">
                        Web for research or purchase
                    </td>
                </tr>

                <tr>
                    <td>Occupation</td>
                    <td>
                        <select name="occupation" required>
                            <option value="">Select one</option>
                            <option>Student</option>
                            <option>Employee</option>
                            <option>Business</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input
                            type="radio"
                            name="junk"
                            value="absolutely"
                            required>
                        Absolutely

                        <input
                            type="radio"
                            name="junk"
                            value="no">
                        No way man
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>


    <hr>


    <!-- Online Registration Form -->
    <div>

        <h2>Online Registration</h2>

        <form>

            <table border="1" cellpadding="8">

                <tr>
                    <td>Username</td>
                    <td>
                        <input
                            type="text"
                            name="username"
                            placeholder="Enter username"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>
                        <input
                            type="password"
                            name="password"
                            placeholder="Enter password"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password</td>
                    <td>
                        <input
                            type="password"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Name</td>
                    <td>
                        <input
                            type="text"
                            name="name"
                            placeholder="Enter your name"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                            required>
                        Male

                        <input
                            type="radio"
                            name="gender"
                            value="female">
                        Female
                    </td>
                </tr>

                <tr>
                    <td>Address</td>
                    <td>
                        <textarea
                            name="address"
                            rows="5"
                            cols="25"
                            placeholder="Enter your address"
                            required></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </td>
                </tr>

                <tr>
                    <td>Profession</td>
                    <td>
                        <select name="profession" required>
                            <option value="">Select profession</option>
                            <option>Student</option>
                            <option>Engineer</option>
                            <option>Teacher</option>
                            <option>Doctor</option>
                            <option>Other</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Upload Files</td>
                    <td>
                        <input
                            type="file"
                            name="files"
                            multiple>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
