<!DOCTYPE html>
<html>
<head>
    <title>Visitors Information</title>
</head>
<body>

    <form>

        <table border="1" cellpadding="8">

            <tr>
                <th colspan="2">
                    <h2>Visitors Information</h2>
                </th>
            </tr>

            <tr>
                <td>Email address</td>
                <td>
                    <input type="text" name="email">
                </td>
            </tr>

            <tr>
                <td>User's interest</td>
                <td>
                    <input type="checkbox" name="interest" value="web">
                    Web for research or purchase
                </td>
            </tr>

            <tr>
                <td>Occupation</td>
                <td>
                    <select name="occupation">
                        <option value="student">Student</option>
                        <option value="employee">Employee</option>
                        <option value="business">Business</option>
                        <option value="other">Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio" name="junk" value="absolutely">
                    Absolutely

                    <input type="radio" name="junk" value="no">
                    No way man
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
